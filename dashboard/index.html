<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildlife &amp; Intrusion Monitor</title>
<style>
  :root {
    --bg: #06110d; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.09);
    --text: #eaf5ee; --muted: #8fa89a; --green: #3ddc97;
    --animal: #f5b544; --human: #ff6f6f; --vehicle: #5fb3ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #0f3a2b 0%, transparent 60%), var(--bg);
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 18px 48px; }

  /* Hero */
  .hero { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
          height: 230px; background: linear-gradient(180deg, #0a2a3a 0%, #0c3a3a 55%, #0f4a3a 100%); }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .copy { position: relative; z-index: 2; padding: 30px 32px; max-width: 620px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .04em;
          padding: 5px 12px; border-radius: 999px; background: rgba(6,17,13,.55);
          border: 1px solid var(--line); color: var(--muted); backdrop-filter: blur(6px); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
            box-shadow: 0 0 10px var(--green); }
  h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.08; margin: 16px 0 10px; font-weight: 750;
       letter-spacing: -.02em; }
  h1 span { color: var(--green); }
  .hero p { color: #b7cdc1; font-size: 15px; max-width: 460px; line-height: 1.5; }

  /* Cards */
  .grid { display: grid; gap: 14px; margin-top: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .two { grid-template-columns: 1fr 1.6fr; }
  @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px;
          backdrop-filter: blur(10px); }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase;
             margin-bottom: 14px; }

  .kpi { display: flex; align-items: center; gap: 14px; }
  .kpi .ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
              background: rgba(61,220,151,.12); color: var(--green); flex: none; }
  .kpi .ico svg { width: 22px; height: 22px; }
  .kpi .n { font-size: 28px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  .kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .kpi.a .ico { background: rgba(255,111,111,.13); color: var(--human); }
  .kpi.b .ico { background: rgba(95,179,255,.13); color: var(--vehicle); }

  /* Donut */
  .donut { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .donut svg { width: 150px; height: 150px; flex: none; }
  .legend { display: grid; gap: 12px; flex: 1; min-width: 140px; }
  .legend div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .legend .sw { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
  .legend .sw svg { width: 17px; height: 17px; }
  .legend b { margin-left: auto; font-size: 16px; }
  .legend small { color: var(--muted); }

  /* Feed */
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 13px;
          padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: .15s; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--green); color: #05150e; border-color: var(--green); font-weight: 600; }
  .toggle { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { accent-color: var(--green); }
  .feed { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 6px;
          grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .feed::-webkit-scrollbar { width: 8px; }
  .feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
  .ev { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
        background: rgba(255,255,255,.035); border: 1px solid var(--line); }
  .ev.muted { opacity: .5; }
  .ev .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .ev .ic svg { width: 22px; height: 22px; }
  .ev .t { flex: 1; min-width: 0; }
  .ev .t b { display: block; font-size: 15px; text-transform: capitalize; }
  .ev .t span { font-size: 12.5px; color: var(--muted); }
  .ring { position: relative; width: 46px; height: 46px; flex: none; }
  .ring svg { width: 46px; height: 46px; transform: rotate(-90deg); }
  .ring em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 650; }
  .empty { color: var(--muted); padding: 24px 4px; font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 26px; opacity: .8; }
</style>
</head>
<body>
<div class="wrap">

  <section class="hero">
    <svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <radialGradient id="moon" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cone" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#3ddc97" stop-opacity=".35"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g id="stars"></g>
      <circle cx="930" cy="62" r="70" fill="url(#moon)" opacity=".5"/>
      <circle cx="930" cy="62" r="22" fill="#fff4cf"/>
      <path d="M0 165 Q160 110 340 150 T700 135 T1200 150 V230 H0Z" fill="#0d3a33" opacity=".9"/>
      <g id="treesBack" fill="#0b2f29"></g>
      <path d="M0 195 Q220 150 470 180 T900 170 T1200 185 V230 H0Z" fill="#0a2a22"/>
      <g id="treesFront" fill="#071d17"></g>
      <path d="M0 215 Q300 190 620 208 T1200 205 V230 H0Z" fill="#05130e"/>
      <!-- camera on a post -->
      <polygon points="1078,176 640,205 640,120" fill="url(#cone)"/>
      <rect x="1084" y="176" width="6" height="52" rx="2" fill="#1c3b30"/>
      <rect x="1062" y="160" width="40" height="22" rx="6" fill="#16332a" stroke="#3ddc97" stroke-opacity=".6"/>
      <circle cx="1071" cy="171" r="6" fill="#0a1a14" stroke="#3ddc97"/>
      <circle cx="1071" cy="171" r="2.4" fill="#3ddc97"/>
      <circle cx="1094" cy="165" r="2" fill="#ff6f6f"/>
    </svg>
    <div class="copy">
      <span class="pill"><i></i> Simulation &middot; demo data</span>
      <h1>Wildlife &amp; Intrusion <span>Monitor</span></h1>
      <p>Low-power edge camera that wakes only when something moves, then decides what it saw.</p>
    </div>
  </section>

  <section class="grid kpis" id="kpis"></section>

  <section class="grid two">
    <div class="card"><h2>Alerts by class</h2><div class="donut" id="donut"></div></div>
    <div class="card"><h2>Activity over time</h2><div id="chart"></div></div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2>Event feed</h2>
    <div class="tools" id="tools"></div>
    <div class="feed" id="feed"></div>
  </section>

  <footer>On-device processing &middot; no images stored &middot; every decision logged</footer>
</div>

<script src="events.js"></script>
<script>
(function () {
  const events = window.EVENTS || [];
  const stats = window.STATS || {};
  const COLORS = { animal: "#f5b544", human: "#ff6f6f", vehicle: "#5fb3ff", nothing: "#8fa89a" };
  const ICONS = {
    animal: '<ellipse cx="12" cy="16" rx="4.5" ry="3.5"/><circle cx="5.8" cy="11.5" r="1.9"/><circle cx="9.8" cy="7.3" r="1.9"/><circle cx="14.2" cy="7.3" r="1.9"/><circle cx="18.2" cy="11.5" r="1.9"/>',
    human: '<circle cx="12" cy="5" r="2.4"/><path d="M12 8.2v6.3M7.5 11.3 12 8.6l4.5 2.7M12 14.5l-3.2 6M12 14.5l3.2 6"/>',
    vehicle: '<path d="M3 15.5l1.9-5.4c.3-.9 1.1-1.6 2.1-1.6h10c1 0 1.8.7 2.1 1.6l1.9 5.4V19H3z"/><circle cx="7.5" cy="18.5" r="1.9"/><circle cx="16.5" cy="18.5" r="1.9"/>',
    nothing: '<path d="M3.5 9h10.2a2.6 2.6 0 1 0-2.6-2.6M3.5 14h14.5a2.6 2.6 0 1 1-2.6 2.6"/>',
    frames: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/>',
    brain: '<path d="M9 4a3 3 0 0 0-3 3v.2A3.2 3.2 0 0 0 4 10.3c0 1 .4 1.8 1.1 2.4A3.3 3.3 0 0 0 6 18a3 3 0 0 0 3 2V4zM15 4a3 3 0 0 1 3 3v.2a3.2 3.2 0 0 1 2 3.1c0 1-.4 1.8-1.1 2.4A3.3 3.3 0 0 1 18 18a3 3 0 0 1-3 2V4z"/>',
    bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
  };
  const svg = (name, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '>' + ICONS[name] + '</svg>';

  /* Hero art: stars and trees */
  (function art() {
    let s = '';
    for (let i = 0; i < 46; i++) {
      const x = (i * 97) % 1200, y = (i * 53) % 110 + 6, r = (i % 3) * 0.5 + 0.7;
      s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#dff3ea" opacity="' + (0.35 + (i % 4) * 0.15) + '"/>';
    }
    document.getElementById('stars').innerHTML = s;
    function trees(base, step, minH, varH, seed) {
      let out = '';
      for (let x = -10; x < 1220; x += step) {
        const h = minH + Math.abs(Math.sin(x * 0.037 + seed)) * varH, w = h * 0.42;
        const y = base + Math.sin(x * 0.011 + seed) * 9;
        out += '<polygon points="' + x + ',' + y + ' ' + (x - w / 2) + ',' + (y - h * 0.5) + ' ' + (x + w / 2) + ',' + (y - h * 0.5) + '"/>' +
               '<polygon points="' + x + ',' + (y - h * 0.3) + ' ' + (x - w * 0.42) + ',' + (y - h * 0.82) + ' ' + (x + w * 0.42) + ',' + (y - h * 0.82) + '"/>' +
               '<polygon points="' + x + ',' + (y - h * 0.55) + ' ' + (x - w * 0.3) + ',' + (y - h) + ' ' + (x + w * 0.3) + ',' + (y - h) + '"/>';
      }
      return out;
    }
    document.getElementById('treesBack').innerHTML = trees(172, 34, 44, 26, 1);
    document.getElementById('treesFront').innerHTML = trees(208, 46, 56, 34, 4);
  })();

  /* KPIs */
  const alerts = events.filter(e => e.action === 'alert');
  const kpi = [
    ['frames', stats.frames, 'Frames processed', ''],
    ['moon', stats.idle, 'Idle, no change', ''],
    ['brain', stats.classifier_calls, 'Classifier runs', 'b'],
    ['bell', stats.alerts, 'Alerts raised', 'a']
  ];
  document.getElementById('kpis').innerHTML = kpi.map(k =>
    '<div class="card kpi ' + k[3] + '"><div class="ico">' + svg(k[0]) + '</div><div><div class="n">' +
    (k[1] == null ? '-' : k[1]) + '</div><div class="l">' + k[2] + '</div></div></div>').join('');

  /* Donut */
  const cls = ['animal', 'human', 'vehicle'];
  const counts = cls.map(c => alerts.filter(e => e.class === c).length);
  const total = counts.reduce((a, b) => a + b, 0);
  const R = 52, C = 2 * Math.PI * R;
  let off = 0, arcs = '';
  counts.forEach((n, i) => {
    const len = total ? (n / total) * C : 0;
    arcs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + COLORS[cls[i]] + '" stroke-width="16" ' +
      'stroke-dasharray="' + Math.max(len - 3, 0) + ' ' + C + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)" stroke-linecap="round"/>';
    off += len;
  });
  document.getElementById('donut').innerHTML =
    '<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16"/>' + arcs +
    '<text x="70" y="70" text-anchor="middle" fill="#eaf5ee" font-size="26" font-weight="750">' + total + '</text>' +
    '<text x="70" y="88" text-anchor="middle" fill="#8fa89a" font-size="10" letter-spacing="1">ALERTS</text></svg>' +
    '<div class="legend">' + cls.map((c, i) =>
      '<div><span class="sw" style="background:' + COLORS[c] + '22;color:' + COLORS[c] + '">' + svg(c) + '</span>' +
      '<span style="text-transform:capitalize">' + c + '</span><b>' + counts[i] + '</b></div>').join('') + '</div>';

  /* Activity chart */
  const ts = e => new Date(e.timestamp.replace(' ', 'T')).getTime();
  (function chart() {
    if (!alerts.length) { document.getElementById('chart').innerHTML = '<div class="empty">No alerts yet.</div>'; return; }
    const all = events.map(ts), t0 = Math.min.apply(null, all), t1 = Math.max.apply(null, all);
    const N = 16, span = (t1 - t0) || 1;
    const b = Array.from({ length: N }, () => ({ animal: 0, human: 0, vehicle: 0 }));
    alerts.forEach(e => { const i = Math.min(N - 1, Math.floor((ts(e) - t0) / span * N)); b[i][e.class]++; });
    const max = Math.max(1, ...b.map(x => x.animal + x.human + x.vehicle));
    const W = 640, H = 230, L = 30, B = 26, T = 10, bw = (W - L) / N;
    let g = '';
    for (let k = 0; k <= 3; k++) {
      const y = T + (H - B - T) * (1 - k / 3);
      g += '<line x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.07)"/>' +
           '<text x="0" y="' + (y + 4) + '" fill="#8fa89a" font-size="11">' + Math.round(max * k / 3) + '</text>';
    }
    b.forEach((x, i) => {
      let y = H - B;
      cls.forEach(c => {
        const h = (x[c] / max) * (H - B - T);
        if (h > 0) { y -= h; g += '<rect x="' + (L + i * bw + 4) + '" y="' + y + '" width="' + (bw - 8) + '" height="' + h + '" rx="4" fill="' + COLORS[c] + '"/>'; }
      });
    });
    const fmt = t => new Date(t).toTimeString().slice(0, 5);
    g += '<text x="' + L + '" y="' + (H - 6) + '" fill="#8fa89a" font-size="11">' + fmt(t0) + '</text>' +
         '<text x="' + (W - 32) + '" y="' + (H - 6) + '" fill="#8fa89a" font-size="11">' + fmt(t1) + '</text>';
    document.getElementById('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' + g + '</svg>';
  })();

  /* Feed */
  let cf = 'all', showDisc = false;
  const tools = document.getElementById('tools');
  tools.innerHTML = ['all', 'animal', 'human', 'vehicle'].map(f =>
    '<button class="chip" data-f="' + f + '" style="text-transform:capitalize">' + f + '</button>').join('') +
    '<label class="toggle"><input type="checkbox" id="disc"> Show filtered triggers</label>';
  function ring(p, color) {
    const r = 19, c = 2 * Math.PI * r;
    return '<div class="ring"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="' + r + '" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/>' +
      '<circle cx="23" cy="23" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (c * p) + ' ' + c + '"/></svg><em>' + Math.round(p * 100) + '</em></div>';
  }
  function render() {
    const list = events.filter(e => (showDisc || e.action === 'alert') && (cf === 'all' || e.class === cf)).slice().reverse();
    document.getElementById('feed').innerHTML = list.length ? list.map(e => {
      const col = COLORS[e.class] || COLORS.nothing;
      return '<div class="ev ' + (e.action === 'alert' ? '' : 'muted') + '"><div class="ic" style="background:' + col + '22;color:' + col + '">' + svg(ICONS[e.class] ? e.class : 'nothing') + '</div>' +
        '<div class="t"><b>' + (e.action === 'alert' ? e.class + ' detected' : e.class + ' &middot; filtered') + '</b><span>' + e.timestamp.slice(11) + '</span></div>' + ring(e.confidence, col) + '</div>';
    }).join('') : '<div class="empty">Nothing to show for this filter.</div>';
    tools.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.f === cf));
  }
  tools.querySelectorAll('.chip').forEach(b => b.onclick = () => { cf = b.dataset.f; render(); });
  document.getElementById('disc').onchange = e => { showDisc = e.target.checked; render(); };
  render();
})();
</script>
</body>
</html>
